<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contests — CFCompanion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Syne:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f2f0eb;
        --bg-2: #eceae4;
        --bg-3: #e4e2dc;
        --ink: #0f0e0c;
        --ink-2: #3a3830;
        --ink-3: #7a7670;
        --cf: #ff4f00;
        --cf-dim: #cc3f00;
        --cf-pale: #fff0eb;
        --amber: #d97706;
        --amber-pale: #fffbeb;
        --red: #dc2626;
        --red-pale: #fef2f2;
        --navy: #0a1628;
        --navy-2: #162238;
        --white: #fafaf8;
        --neo-out: 6px 6px 14px #c8c6c0, -4px -4px 10px #ffffff;
        --neo-in: inset 3px 3px 8px #c8c6c0, inset -3px -3px 6px #ffffff;
        --neo-card: 8px 8px 20px #c0beb8, -5px -5px 14px #ffffff;
        --neo-sm: 3px 3px 8px #c8c6c0, -2px -2px 6px #ffffff;
        --serif: "Instrument Serif", Georgia, serif;
        --mono: "DM Mono", monospace;
        --sans: "Syne", sans-serif;
        --ease: cubic-bezier(0.23, 1, 0.32, 1);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: #c8c6c0;
        border-radius: 99px;
      }
      html {
        scrollbar-width: thin;
        scrollbar-color: #c8c6c0 var(--bg);
        overflow-y: scroll;
      }

      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }

      /* Grain */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        opacity: 0.025;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        background-size: 160px 160px;
      }

      /* ━━━━ Nav ━━━━ */
      .nav {
        position: sticky;
        top: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        height: 60px;
        background: rgba(242, 240, 235, 0.9);
        backdrop-filter: blur(16px) saturate(140%);
        border-bottom: 1px solid rgba(15, 14, 12, 0.08);
      }
      .nav-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: var(--sans);
        font-weight: 800;
        font-size: 17px;
        letter-spacing: -0.04em;
        color: var(--ink);
        text-decoration: none;
      }
      .nav-logo {
        width: 28px;
        height: 28px;
        border-radius: 7px;
        background: var(--navy);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--neo-sm);
      }
      .nav-logo span {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--cf);
      }
      .nav-links {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 4px;
      }
      .nav-link {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--ink-3);
        text-decoration: none;
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid transparent;
        transition: all 0.2s var(--ease);
      }
      .nav-link:hover {
        color: var(--ink);
        background: var(--bg-2);
        box-shadow: var(--neo-sm);
        border-color: rgba(15, 14, 12, 0.06);
      }
      .nav-link.active {
        color: var(--cf);
        border-color: rgba(255, 79, 0, 0.2);
        background: var(--cf-pale);
      }

      .nav-cta {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .btn-neo {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.04em;
        padding: 9px 20px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        transition: all 0.18s var(--ease);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .btn-outline {
        background: var(--bg);
        color: var(--ink);
        box-shadow: var(--neo-out);
        border: 1px solid rgba(15, 14, 12, 0.08);
      }

      .btn-outline:hover {
        box-shadow: var(--neo-in);
        transform: translateY(1px);
      }

      .btn-solid {
        background: var(--navy);
        color: var(--white);
        box-shadow: 4px 4px 12px rgba(10, 22, 40, 0.35);
      }

      .btn-solid:hover {
        background: var(--navy-2);
        transform: translateY(-1px);
        box-shadow: 6px 6px 18px rgba(10, 22, 40, 0.4);
      }

      /* ━━━━ Layout ━━━━ */
      .main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 48px 32px 80px;
      }

      /* ━━━━ Page top ━━━━ */
      .page-top {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        margin-bottom: 36px;
        animation: fadeUp 0.5s var(--ease) both;
      }
      .page-eyebrow {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink-3);
        margin-bottom: 6px;
      }
      .page-title {
        font-family: var(--serif);
        font-size: 44px;
        font-weight: 400;
        letter-spacing: -0.03em;
        line-height: 1;
      }

      /* Handle widget */
      .handle-widget {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--bg);
        border-radius: 12px;
        box-shadow: var(--neo-out);
        border: 1px solid rgba(255, 255, 255, 0.7);
        padding: 10px 14px;
      }
      .handle-widget-label {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.12em;
        color: var(--ink-3);
        white-space: nowrap;
      }
      .handle-widget-input {
        background: none;
        border: none;
        outline: none;
        font-family: var(--mono);
        font-size: 13px;
        color: var(--ink);
        width: 140px;
      }
      .handle-widget-input::placeholder {
        color: var(--ink-3);
      }
      .handle-widget-btn {
        background: var(--navy);
        color: var(--white);
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.04em;
        padding: 6px 14px;
        border-radius: 7px;
        border: none;
        cursor: pointer;
        box-shadow: 3px 3px 8px rgba(10, 22, 40, 0.28);
        transition: all 0.18s var(--ease);
      }
      .handle-widget-btn:hover {
        background: var(--navy-2);
        transform: translateY(-1px);
      }

      /* ━━━━ Filter tabs ━━━━ */
      .filter-row {
        display: flex;
        gap: 8px;
        margin-bottom: 28px;
        animation: fadeUp 0.5s 0.08s var(--ease) both;
      }
      .filter-tab {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.06em;
        padding: 8px 18px;
        border-radius: 99px;
        cursor: pointer;
        background: var(--bg);
        box-shadow: var(--neo-out);
        border: 1px solid rgba(255, 255, 255, 0.7);
        color: var(--ink-3);
        transition: all 0.2s var(--ease);
      }
      .filter-tab:hover {
        color: var(--ink);
        box-shadow: var(--neo-in);
        transform: translateY(1px);
      }
      .filter-tab.active {
        background: var(--navy);
        color: var(--white);
        border-color: transparent;
        box-shadow: 4px 4px 12px rgba(10, 22, 40, 0.3);
      }

      /* ━━━━ Contest grid ━━━━ */
      .contests-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
        gap: 18px;
      }

      /* ━━━━ Contest card ━━━━ */
      .contest-card {
        background: var(--bg);
        border-radius: 20px;
        box-shadow: var(--neo-card);
        border: 1px solid rgba(255, 255, 255, 0.7);
        padding: 26px 28px;
        position: relative;
        overflow: hidden;
        transition:
          transform 0.3s var(--ease),
          box-shadow 0.3s var(--ease);
        animation: fadeUp 0.5s var(--ease) both;
        display: flex;
        flex-direction: column;
      }

      .contest-card:hover {
        transform: translateY(-4px);
        box-shadow:
          12px 12px 32px #b8b7b1,
          -7px -7px 20px #ffffff;
      }

      /* Top urgency bar */
      .contest-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--bar-color, rgba(15, 14, 12, 0.1));
        transition: background 0.5s;
      }

      /* Urgency variants */
      .contest-card.urgent {
        --bar-color: var(--red);
      }
      .contest-card.soon {
        --bar-color: var(--amber);
      }
      .contest-card.later {
        --bar-color: var(--cf);
      }

      /* Urgent pulse */
      .contest-card.urgent::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--red);
        animation: urgentPulse 1.5s ease-in-out infinite;
      }
      @keyframes urgentPulse {
        0%,
        100% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
      }

      /* ── Card header ── */
      .card-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 20px;
      }

      .contest-name {
        font-family: var(--sans);
        font-size: 15px;
        font-weight: 600;
        color: var(--ink);
        line-height: 1.35;
        flex: 1;
        letter-spacing: -0.01em;
      }

      .contest-type-badge {
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 4px 10px;
        border-radius: 99px;
        flex-shrink: 0;
        background: var(--bg-2);
        box-shadow: var(--neo-sm);
        border: 1px solid rgba(255, 255, 255, 0.7);
        color: var(--ink-3);
        margin-top: 2px;
      }

      /* Urgency badge colors */
      .contest-card.urgent .contest-type-badge {
        background: var(--red-pale);
        color: var(--red);
        border-color: rgba(220, 38, 38, 0.15);
        box-shadow: none;
      }
      .contest-card.soon .contest-type-badge {
        background: var(--amber-pale);
        color: var(--amber);
        border-color: rgba(217, 119, 6, 0.15);
        box-shadow: none;
      }

      /* ── Countdown ── */
      .countdown-wrap {
        margin-bottom: 20px;
      }

      .countdown-eyebrow {
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink-3);
        margin-bottom: 10px;
      }

      .countdown {
        display: flex;
        align-items: flex-end;
        gap: 4px;
      }

      .cd-unit {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .cd-num {
        font-family: var(--mono);
        font-size: 30px;
        font-weight: 500;
        line-height: 1;
        letter-spacing: -0.04em;
        color: var(--ink);
        background: var(--bg-2);
        box-shadow: var(--neo-in);
        border-radius: 8px;
        padding: 7px 12px;
        min-width: 56px;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.6);
        transition: color 0.4s;
      }

      /* Urgency tints the numbers */
      .contest-card.urgent .cd-num {
        color: var(--red);
        background: var(--red-pale);
        border-color: rgba(220, 38, 38, 0.1);
      }
      .contest-card.soon .cd-num {
        color: var(--amber);
        background: var(--amber-pale);
        border-color: rgba(217, 119, 6, 0.1);
      }

      .cd-sep {
        font-family: var(--mono);
        font-size: 22px;
        font-weight: 300;
        color: var(--ink-3);
        padding-bottom: 14px;
        padding-inline: 2px;
      }

      .cd-label {
        font-family: var(--mono);
        font-size: 8px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-3);
      }

      /* ── Card meta ── */
      .card-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 20px;
      }

      .meta-chip {
        display: flex;
        align-items: center;
        gap: 5px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink-3);
      }

      .meta-chip-icon {
        font-size: 12px;
        opacity: 0.6;
      }

      /* ── Card actions ── */
      .card-actions {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: auto;
        padding-top: 20px;
      }

      .btn-register {
        flex: 1;
        text-align: center;
        text-decoration: none;
        background: var(--navy);
        color: var(--white);
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.04em;
        height: 36px;
        border-radius: 8px;
        box-shadow: 3px 3px 10px rgba(10, 22, 40, 0.28);
        transition: all 0.2s var(--ease);
        border: none;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .btn-register:hover {
        background: var(--navy-2);
        transform: translateY(-1px);
        box-shadow: 4px 4px 14px rgba(10, 22, 40, 0.35);
      }

      .btn-remind {
        flex: 1;
        text-align: center;
        background: var(--bg);
        color: var(--ink-3);
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.04em;
        height: 36px;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: var(--neo-out);
        border: 1px solid rgba(255, 255, 255, 0.7);
        transition: all 0.2s var(--ease);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .btn-remind:hover {
        color: var(--ink);
        box-shadow: var(--neo-in);
        transform: translateY(1px);
      }
      .btn-remind.reminded {
        background: var(--cf-pale);
        color: var(--cf);
        border-color: rgba(255, 79, 0, 0.2);
        box-shadow: none;
      }
      .btn-remind:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .btn-cal {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        flex-shrink: 0;
        background: var(--bg);
        box-shadow: var(--neo-out);
        border: 1px solid rgba(255, 255, 255, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.2s var(--ease);
      }
      .btn-cal:hover {
        box-shadow: var(--neo-in);
        transform: translateY(1px);
      }

      /* ━━━━ Skeleton cards ━━━━ */
      .skeleton-card {
        background: var(--bg);
        border-radius: 20px;
        box-shadow: var(--neo-card);
        border: 1px solid rgba(255, 255, 255, 0.7);
        height: 220px;
        overflow: hidden;
        animation: fadeUp 0.5s var(--ease) both;
      }
      .sk-inner {
        height: 100%;
        background: linear-gradient(90deg, var(--bg) 25%, var(--bg-2) 50%, var(--bg) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.6s infinite;
      }
      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      /* ━━━━ Empty state ━━━━ */
      .empty-state {
        grid-column: 1/-1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 100px 24px;
        gap: 14px;
        color: var(--ink-3);
        text-align: center;
      }
      .empty-icon {
        font-size: 44px;
        opacity: 0.2;
      }
      .empty-text {
        font-family: var(--mono);
        font-size: 13px;
        letter-spacing: 0.05em;
      }

      /* ━━━━ Toast ━━━━ */
      .toast {
        position: fixed;
        bottom: 28px;
        right: 28px;
        z-index: 999;
        background: var(--navy);
        color: var(--white);
        font-family: var(--mono);
        font-size: 12px;
        padding: 12px 20px;
        border-radius: 10px;
        box-shadow: 8px 8px 24px rgba(10, 22, 40, 0.4);
        transform: translateY(16px);
        opacity: 0;
        transition: all 0.3s var(--ease);
        pointer-events: none;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .toast.show {
        transform: translateY(0);
        opacity: 1;
      }
      .toast.ok {
        border-color: rgba(22, 163, 74, 0.35);
      }
      .toast.err {
        border-color: rgba(255, 79, 0, 0.35);
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 900px) {
        .contests-grid {
          grid-template-columns: 1fr;
        }
        .page-top {
          flex-direction: column;
          align-items: flex-start;
          gap: 16px;
        }
      }
      @media (max-width: 600px) {
        .nav {
          padding: 0 20px;
        }
        .nav-links {
          display: none;
        }
        .main {
          padding: 28px 20px 60px;
        }
        .filter-row {
          flex-wrap: wrap;
        }
      }

      /* Page transition overlay styling */
      .page-transition-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--bg);
        z-index: 9999;
        pointer-events: none;
        opacity: 1;
        transition: opacity 0.3s var(--ease);
      }
      .page-transition-overlay.fade-out {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <!-- ━━━━ Nav ━━━━ -->
    <nav class="nav">
      <a href="../index.html" class="nav-brand">
        <div class="nav-logo"><span>CF</span></div>
        Companion
      </a>
      <div class="nav-links">
        <a href="../index.html#features" class="nav-link">Features</a>
        <a href="../index.html#picker" class="nav-link">Picker</a>
        <a href="dashboard.html" class="nav-link">Analyzer</a>
        <a href="leaderboard.html" class="nav-link">Leaderboard</a>
        <a href="contests.html" class="nav-link active">Contests</a>
        <a href="ai-coach.html" class="nav-link">AI Coach</a>
        <a href="forum.html" class="nav-link">Forum</a>
      </div>
      <div class="nav-cta">
        <a href="leaderboard.html" class="btn-neo btn-outline">Join Leaderboard</a>
        <a href="dashboard.html" class="btn-neo btn-solid">Analyze Profile →</a>
      </div>
    </nav>

    <main class="main">
      <!-- Page top -->
      <div class="page-top">
        <div>
          <div class="page-eyebrow">// upcoming contests</div>
          <h1 class="page-title">Contests</h1>
        </div>
        <div class="handle-widget">
          <div class="handle-widget-label">handle:</div>
          <input
            class="handle-widget-input"
            id="myHandle"
            type="text"
            placeholder="your CF handle"
            spellcheck="false"
            autocomplete="off"
          />
          <button class="handle-widget-btn" onclick="saveHandle()">Set</button>
        </div>
      </div>

      <!-- Filters -->
      <div class="filter-row">
        <button class="filter-tab active" onclick="setFilter('all', this)">All</button>
        <button class="filter-tab" onclick="setFilter('CF', this)">Codeforces</button>
        <button class="filter-tab" onclick="setFilter('ICPC', this)">ICPC</button>
        <button class="filter-tab" onclick="setFilter('IOI', this)">IOI</button>
      </div>

      <!-- Cards -->
      <div class="contests-grid" id="contestsGrid">
        <div class="skeleton-card" style="animation-delay: 0s"><div class="sk-inner"></div></div>
        <div class="skeleton-card" style="animation-delay: 0.06s"><div class="sk-inner"></div></div>
        <div class="skeleton-card" style="animation-delay: 0.12s"><div class="sk-inner"></div></div>
      </div>
    </main>

    <div class="toast" id="toast"></div>

    <script src="../js/config.js"></script>
    <script>
      const API = window.CF_API_URL || "http://localhost:3000";
      let allContests = [];
      let activeFilter = "all";
      let myHandle = localStorage.getItem("cf_handle") || "";
      let userReminders = new Set();

      if (myHandle) document.getElementById("myHandle").value = myHandle;

      /* ━━━━ Utilities ━━━━ */
      function toast(msg, type = "") {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.className = `toast ${type} show`;
        clearTimeout(el._t);
        el._t = setTimeout(() => el.classList.remove("show"), 3500);
      }

      function saveHandle() {
        const h = document.getElementById("myHandle").value.trim();
        if (!h) return;
        myHandle = h;
        localStorage.setItem("cf_handle", h);
        toast(`Handle set to ${h}`, "ok");
        loadReminders();
      }

      document.getElementById("myHandle").addEventListener("keydown", (e) => {
        if (e.key === "Enter") saveHandle();
      });

      function formatDuration(seconds) {
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        if (h === 0) return `${m}m`;
        if (m === 0) return `${h}h`;
        return `${h}h ${m}m`;
      }

      function urgencyClass(secondsUntil) {
        if (secondsUntil < 3600) return "urgent";
        if (secondsUntil < 86400) return "soon";
        return "later";
      }

      function pad(n) {
        return String(Math.max(0, n)).padStart(2, "0");
      }

      function getCountdownParts(secondsUntil) {
        const s = Math.max(0, Math.floor(secondsUntil));
        const d = Math.floor(s / 86400);
        const h = Math.floor((s % 86400) / 3600);
        const m = Math.floor((s % 3600) / 60);
        const sec = s % 60;
        return { d, h, m, sec };
      }

      function buildCountdownHTML(secondsUntilStart, startEpoch) {
        const { d, h, m, sec } = getCountdownParts(secondsUntilStart);
        if (d > 0) {
          return `<div class="countdown" data-start-epoch="${startEpoch}">
      <div class="cd-unit"><div class="cd-num">${d}</div><div class="cd-label">days</div></div>
      <div class="cd-sep">:</div>
      <div class="cd-unit"><div class="cd-num">${pad(h)}</div><div class="cd-label">hrs</div></div>
      <div class="cd-sep">:</div>
      <div class="cd-unit"><div class="cd-num">${pad(m)}</div><div class="cd-label">min</div></div>
      <div class="cd-sep">:</div>
      <div class="cd-unit"><div class="cd-num">${pad(sec)}</div><div class="cd-label">sec</div></div>
    </div>`;
        }
        return `<div class="countdown" data-start-epoch="${startEpoch}">
    <div class="cd-unit"><div class="cd-num">${pad(h)}</div><div class="cd-label">hrs</div></div>
    <div class="cd-sep">:</div>
    <div class="cd-unit"><div class="cd-num">${pad(m)}</div><div class="cd-label">min</div></div>
    <div class="cd-sep">:</div>
    <div class="cd-unit"><div class="cd-num">${pad(sec)}</div><div class="cd-label">sec</div></div>
    <div class="cd-unit"><div class="cd-num" style="visibility:hidden">00</div><div class="cd-label"></div></div>
  </div>`;
      }

      function getContestType(name) {
        const n = name.toUpperCase();
        if (n.includes("ICPC")) return "ICPC";
        if (n.includes("IOI")) return "IOI";
        if (n.includes("DIV. 1") && n.includes("DIV. 2")) return "CF Div.1+2";
        if (n.includes("DIV. 1")) return "CF Div.1";
        if (n.includes("DIV. 2")) return "CF Div.2";
        if (n.includes("DIV. 3")) return "CF Div.3";
        if (n.includes("DIV. 4")) return "CF Div.4";
        if (n.includes("EDUCATIONAL")) return "Educational";
        if (n.includes("GLOBAL")) return "CF Global";
        return "CF";
      }

      function buildCalendarLink(contest) {
        const start = new Date(contest.startsAt);
        const end = new Date(start.getTime() + contest.durationSeconds * 1000);
        const fmt = (d) => d.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
        const title = encodeURIComponent(contest.name);
        return `https://www.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${fmt(start)}/${fmt(end)}&details=${encodeURIComponent("https://codeforces.com/contests")}`;
      }

      /* ━━━━ Render cards ━━━━ */
      function renderCards(contests) {
        const grid = document.getElementById("contestsGrid");
        if (!contests.length) {
          grid.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📅</div>
      <div class="empty-text">No upcoming contests found</div>
    </div>`;
          return;
        }

        grid.innerHTML = contests
          .map((c, i) => {
            const urgency = urgencyClass(c.secondsUntilStart);
            const type = getContestType(c.name);
            const duration = formatDuration(c.durationSeconds);
            const startStr = new Date(c.startsAt).toLocaleString("en-US", {
              weekday: "short",
              month: "short",
              day: "numeric",
              hour: "2-digit",
              minute: "2-digit",
              timeZoneName: "short",
            });
            const startEpoch = new Date(c.startsAt).getTime() / 1000;
            const isReminded = userReminders.has(c.id);
            const calLink = buildCalendarLink(c);

            return `
    <div class="contest-card ${urgency}" data-contest-id="${c.id}" data-type="${type}"
         style="animation-delay:${i * 0.05}s">
      <div class="card-header">
        <div class="contest-name">${c.name}</div>
        <div class="contest-type-badge">${type}</div>
      </div>
      <div class="countdown-wrap">
        <div class="countdown-eyebrow">// starts in</div>
        ${buildCountdownHTML(c.secondsUntilStart, startEpoch)}
      </div>
      <div class="card-meta">
        <div class="meta-chip">
          <span class="meta-chip-icon">📅</span>${startStr}
        </div>
        <div class="meta-chip">
          <span class="meta-chip-icon">⏱</span>${duration}
        </div>
      </div>
      <div class="card-actions">
        <a class="btn-register" href="https://codeforces.com/contests/${c.id}"
           target="_blank" rel="noopener">Register →</a>
        <button class="btn-remind ${isReminded ? "reminded" : ""}"
                id="remind-${c.id}"
                onclick="toggleReminder(${c.id}, '${c.name.replace(/'/g, "\\'")}')">
          ${isReminded ? "✓ Reminded" : "⏰ Remind me"}
        </button>
        <a class="btn-cal" href="${calLink}" target="_blank" rel="noopener" title="Add to Google Calendar">📅</a>
      </div>
    </div>`;
          })
          .join("");
      }

      /* ━━━━ Filter ━━━━ */
      function setFilter(type, btn) {
        activeFilter = type;
        document.querySelectorAll(".filter-tab").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        applyFilter();
      }

      function applyFilter() {
        const filtered =
          activeFilter === "all"
            ? allContests
            : allContests.filter((c) =>
                getContestType(c.name).toUpperCase().includes(activeFilter.toUpperCase())
              );
        renderCards(filtered);
      }

      /* ━━━━ Reminders ━━━━ */
      async function loadReminders() {
        if (!myHandle) return;
        try {
          const res = await fetch(`${API}/api/contests/reminders/${myHandle}`);
          if (!res.ok) return;
          const data = await res.json();
          userReminders = new Set(data.map((r) => r.cfContestId));
          applyFilter();
        } catch (_) {}
      }

      async function toggleReminder(contestId, contestName) {
        if (!myHandle) {
          toast("Set your handle first (top right)", "err");
          document.getElementById("myHandle").focus();
          return;
        }
        const btn = document.getElementById(`remind-${contestId}`);
        const isReminded = userReminders.has(contestId);
        btn.disabled = true;
        try {
          if (isReminded) {
            await fetch(`${API}/api/contests/remind`, {
              method: "DELETE",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ cfHandle: myHandle, cfContestId: contestId }),
            });
            userReminders.delete(contestId);
            btn.textContent = "⏰ Remind me";
            btn.classList.remove("reminded");
            toast("Reminder removed", "ok");
          } else {
            const res = await fetch(`${API}/api/contests/remind`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ cfHandle: myHandle, cfContestId: contestId }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error);
            userReminders.add(contestId);
            btn.textContent = "✓ Reminded";
            btn.classList.add("reminded");
            toast("Reminder set! We'll email you 1h before.", "ok");
          }
        } catch (err) {
          toast(err.message, "err");
        } finally {
          btn.disabled = false;
        }
      }

      /* ━━━━ Countdown tick ━━━━ */
      function tickCountdowns() {
        document.querySelectorAll(".contest-card").forEach((card) => {
          const cdEl = card.querySelector(".countdown");
          if (!cdEl) return;
          const startEpoch = parseFloat(cdEl.dataset.startEpoch);
          const remaining = startEpoch - Date.now() / 1000;
          const { d, h, m, sec } = getCountdownParts(remaining);
          const nums = card.querySelectorAll(".cd-num");
          if (d > 0) {
            nums[0].textContent = d;
            nums[1].textContent = pad(h);
            nums[2].textContent = pad(m);
            nums[3].textContent = pad(sec);
          } else {
            nums[0].textContent = pad(h);
            nums[1].textContent = pad(m);
            nums[2].textContent = pad(sec);
          }
          // Escalate urgency class live
          if (remaining < 3600 && !card.classList.contains("urgent")) {
            card.classList.remove("soon", "later");
            card.classList.add("urgent");
          } else if (
            remaining < 86400 &&
            !card.classList.contains("soon") &&
            !card.classList.contains("urgent")
          ) {
            card.classList.remove("later");
            card.classList.add("soon");
          }
        });
      }

      /* ━━━━ Init ━━━━ */
      async function loadContests() {
        try {
          const res = await fetch(`${API}/api/contests/upcoming`);
          if (!res.ok) throw new Error("Failed to load contests");
          allContests = await res.json();
          applyFilter();
          if (myHandle) loadReminders();
          setInterval(tickCountdowns, 1000);
        } catch (err) {
          document.getElementById("contestsGrid").innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚠</div>
        <div class="empty-text">${err.message}</div>
      </div>`;
        }
      }

      loadContests();

      // Page Transition Effect
      (function () {
        const overlay = document.createElement("div");
        overlay.className = "page-transition-overlay";
        document.body.appendChild(overlay);
        requestAnimationFrame(() => {
          overlay.classList.add("fade-out");
        });
        setTimeout(() => {
          overlay.remove();
        }, 400);

        document.querySelectorAll("a").forEach((link) => {
          const href = link.getAttribute("href");
          if (
            !href ||
            href.startsWith("#") ||
            href.startsWith("http") ||
            href.startsWith("javascript:") ||
            link.target === "_blank"
          )
            return;
          link.addEventListener("click", (e) => {
            e.preventDefault();
            const exitOverlay = document.createElement("div");
            exitOverlay.className = "page-transition-overlay fade-out";
            document.body.appendChild(exitOverlay);
            requestAnimationFrame(() => {
              exitOverlay.classList.remove("fade-out");
            });
            setTimeout(() => {
              window.location.href = href;
            }, 300);
          });
        });
      })();
    </script>
  </body>
</html>
