<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thread — CFCompanion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Syne:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f2f0eb;
        --bg-2: #eceae4;
        --bg-3: #e4e2dc;
        --ink: #0f0e0c;
        --ink-2: #3a3830;
        --ink-3: #7a7670;
        --cf: #ff4f00;
        --cf-dim: #cc3f00;
        --cf-pale: #fff0eb;
        --navy: #0a1628;
        --navy-2: #162238;
        --white: #fafaf8;
        --neo-out: 6px 6px 14px #c8c6c0, -4px -4px 10px #ffffff;
        --neo-in: inset 3px 3px 8px #c8c6c0, inset -3px -3px 6px #ffffff;
        --neo-card: 8px 8px 20px #c0beb8, -5px -5px 14px #ffffff;
        --neo-sm: 3px 3px 8px #c8c6c0, -2px -2px 6px #ffffff;
        --serif: "Instrument Serif", Georgia, serif;
        --mono: "DM Mono", monospace;
        --sans: "Syne", sans-serif;
        --ease: cubic-bezier(0.23, 1, 0.32, 1);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: #c8c6c0;
        border-radius: 99px;
      }
      html {
        scrollbar-width: thin;
        scrollbar-color: #c8c6c0 var(--bg);
        overflow-y: scroll;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        opacity: 0.025;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        background-size: 160px 160px;
      }
      .nav {
        position: sticky;
        top: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        height: 60px;
        background: rgba(242, 240, 235, 0.9);
        backdrop-filter: blur(16px) saturate(140%);
        border-bottom: 1px solid rgba(15, 14, 12, 0.08);
      }
      .nav-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: var(--sans);
        font-weight: 800;
        font-size: 17px;
        letter-spacing: -0.04em;
        color: var(--ink);
        text-decoration: none;
      }
      .nav-logo {
        width: 28px;
        height: 28px;
        border-radius: 7px;
        background: var(--navy);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--neo-sm);
      }
      .nav-logo span {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--cf);
      }
      .nav-links {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 4px;
      }
      .nav-link {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--ink-3);
        text-decoration: none;
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid transparent;
        transition: all 0.2s var(--ease);
      }
      .nav-link:hover {
        color: var(--ink);
        background: var(--bg-2);
        box-shadow: var(--neo-sm);
        border-color: rgba(15, 14, 12, 0.06);
      }
      .nav-link.active {
        color: var(--cf);
        border-color: rgba(255, 79, 0, 0.2);
        background: var(--cf-pale);
      }
      .nav-cta {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .btn-neo {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.04em;
        padding: 9px 20px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        transition: all 0.18s var(--ease);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .btn-outline {
        background: var(--bg);
        color: var(--ink);
        box-shadow: var(--neo-out);
        border: 1px solid rgba(15, 14, 12, 0.08);
      }
      .btn-outline:hover {
        box-shadow: var(--neo-in);
        transform: translateY(1px);
      }
      .btn-solid {
        background: var(--navy);
        color: var(--white);
        box-shadow: 4px 4px 12px rgba(10, 22, 40, 0.35);
      }
      .btn-solid:hover {
        background: var(--navy-2);
        transform: translateY(-1px);
      }
      .main {
        max-width: 860px;
        margin: 0 auto;
        padding: 48px 32px 80px;
      }
      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 28px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink-3);
        animation: fadeUp 0.4s var(--ease) both;
      }
      .breadcrumb a {
        color: var(--ink-3);
        text-decoration: none;
        transition: color 0.15s;
      }
      .breadcrumb a:hover {
        color: var(--cf);
      }
      .breadcrumb-sep {
        opacity: 0.4;
      }
      .thread-header {
        background: var(--navy);
        border-radius: 20px;
        padding: 28px 32px;
        margin-bottom: 24px;
        position: relative;
        overflow: hidden;
        animation: fadeUp 0.5s 0.05s var(--ease) both;
      }
      .thread-header::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, var(--cf), transparent);
      }
      .thread-tag-badge {
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        padding: 4px 10px;
        border-radius: 99px;
        background: rgba(255, 79, 0, 0.15);
        color: var(--cf);
        border: 1px solid rgba(255, 79, 0, 0.25);
        margin-bottom: 10px;
        display: inline-block;
      }
      .thread-title {
        font-family: var(--serif);
        font-size: 28px;
        font-weight: 400;
        color: var(--white);
        letter-spacing: -0.02em;
        line-height: 1.2;
        margin-bottom: 10px;
      }
      .thread-meta-row {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      .thread-meta-item {
        font-family: var(--mono);
        font-size: 11px;
        color: rgba(255, 255, 255, 0.4);
      }
      .thread-meta-item strong {
        color: rgba(255, 255, 255, 0.7);
        font-weight: 500;
      }
      .posts-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-bottom: 24px;
        animation: fadeUp 0.5s 0.1s var(--ease) both;
      }
      .post-card {
        background: var(--bg);
        border-radius: 16px;
        box-shadow: var(--neo-card);
        border: 1px solid rgba(255, 255, 255, 0.7);
        overflow: hidden;
      }
      .post-card.first-post {
        border-color: rgba(255, 79, 0, 0.15);
      }
      .post-card.first-post::before {
        content: "";
        display: block;
        height: 2px;
        background: linear-gradient(90deg, var(--cf), transparent);
      }
      .post-inner {
        padding: 20px 24px;
      }
      .post-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .post-author-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .post-avatar {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: var(--bg-2);
        box-shadow: var(--neo-sm);
        border: 1px solid rgba(255, 255, 255, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 500;
        color: var(--ink-2);
        flex-shrink: 0;
      }
      .post-avatar.op {
        background: var(--cf-pale);
        color: var(--cf);
        border-color: rgba(255, 79, 0, 0.2);
      }
      .post-author {
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 500;
        color: var(--ink);
      }
      .post-op-badge {
        font-family: var(--mono);
        font-size: 9px;
        padding: 2px 6px;
        border-radius: 4px;
        background: var(--cf-pale);
        color: var(--cf);
        border: 1px solid rgba(255, 79, 0, 0.2);
        margin-left: 4px;
      }
      .post-time {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--ink-3);
      }
      .post-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .upvote-btn {
        display: flex;
        align-items: center;
        gap: 5px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink-3);
        background: var(--bg-2);
        border: 1px solid rgba(15, 14, 12, 0.07);
        box-shadow: var(--neo-sm);
        padding: 5px 10px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.15s var(--ease);
      }
      .upvote-btn:hover {
        color: var(--cf);
        border-color: rgba(255, 79, 0, 0.2);
        background: var(--cf-pale);
      }
      .upvote-btn.voted {
        color: var(--cf);
        border-color: rgba(255, 79, 0, 0.25);
        background: var(--cf-pale);
        box-shadow: none;
      }
      .reply-btn {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink-3);
        background: none;
        border: none;
        cursor: pointer;
        padding: 5px 8px;
        border-radius: 5px;
        transition: color 0.15s;
      }
      .reply-btn:hover {
        color: var(--cf);
      }
      .post-content {
        font-family: var(--sans);
        font-size: 14px;
        color: var(--ink-2);
        line-height: 1.75;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .replies-list {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid rgba(15, 14, 12, 0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding-left: 20px;
      }
      .reply-card {
        background: var(--bg-2);
        border-radius: 10px;
        padding: 14px 16px;
        border: 1px solid rgba(15, 14, 12, 0.06);
      }
      .reply-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .reply-author {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 500;
        color: var(--ink-2);
      }
      .reply-time {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--ink-3);
      }
      .reply-content {
        font-family: var(--sans);
        font-size: 13px;
        color: var(--ink-3);
        line-height: 1.65;
        white-space: pre-wrap;
      }
      .reply-form {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid rgba(15, 14, 12, 0.06);
        display: none;
      }
      .reply-form.open {
        display: block;
      }
      .reply-textarea {
        width: 100%;
        background: var(--bg);
        border: 1px solid rgba(15, 14, 12, 0.1);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 13px;
        line-height: 1.6;
        padding: 10px 14px;
        border-radius: 8px;
        outline: none;
        box-shadow: var(--neo-in);
        resize: vertical;
        min-height: 72px;
        transition: border-color 0.2s;
      }
      .reply-textarea:focus {
        border-color: var(--cf);
      }
      .reply-textarea::placeholder {
        color: var(--ink-3);
      }
      .reply-actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .reply-submit {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
        padding: 8px 16px;
        border-radius: 7px;
        background: var(--navy);
        color: var(--white);
        border: none;
        cursor: pointer;
        box-shadow: 3px 3px 8px rgba(10, 22, 40, 0.25);
        transition: all 0.2s var(--ease);
      }
      .reply-submit:hover {
        background: var(--navy-2);
        transform: translateY(-1px);
      }
      .reply-submit:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }
      .reply-cancel {
        font-family: var(--mono);
        font-size: 11px;
        padding: 8px 12px;
        border-radius: 7px;
        background: none;
        color: var(--ink-3);
        border: none;
        cursor: pointer;
      }
      .reply-cancel:hover {
        color: var(--ink);
      }
      .new-post-panel {
        background: var(--bg);
        border-radius: 18px;
        box-shadow: var(--neo-card);
        border: 1px solid rgba(255, 255, 255, 0.7);
        overflow: hidden;
        animation: fadeUp 0.5s 0.15s var(--ease) both;
      }
      .np-header {
        padding: 16px 24px;
        border-bottom: 1px solid rgba(15, 14, 12, 0.06);
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-3);
      }
      .np-body {
        padding: 20px 24px;
      }
      .np-handle-row {
        display: flex;
        gap: 10px;
        margin-bottom: 12px;
      }
      .np-input {
        background: var(--bg);
        border: 1px solid rgba(15, 14, 12, 0.1);
        color: var(--ink);
        font-family: var(--mono);
        font-size: 13px;
        padding: 9px 14px;
        border-radius: 8px;
        outline: none;
        box-shadow: var(--neo-in);
        transition: border-color 0.2s;
        width: 220px;
      }
      .np-input::placeholder {
        color: var(--ink-3);
      }
      .np-input:focus {
        border-color: var(--cf);
      }
      .np-textarea {
        width: 100%;
        background: var(--bg);
        border: 1px solid rgba(15, 14, 12, 0.1);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.7;
        padding: 12px 16px;
        border-radius: 10px;
        outline: none;
        box-shadow: var(--neo-in);
        resize: vertical;
        min-height: 100px;
        transition: border-color 0.2s;
        margin-bottom: 12px;
      }
      .np-textarea:focus {
        border-color: var(--cf);
      }
      .np-textarea::placeholder {
        color: var(--ink-3);
      }
      .np-submit {
        background: var(--cf);
        color: var(--white);
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.06em;
        padding: 10px 24px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(255, 79, 0, 0.28);
        transition: all 0.2s var(--ease);
      }
      .np-submit:hover {
        background: var(--cf-dim);
        transform: translateY(-1px);
      }
      .np-submit:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }
      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 80px 24px;
        gap: 14px;
        color: var(--ink-3);
        text-align: center;
      }
      .empty-icon {
        font-size: 40px;
        opacity: 0.2;
      }
      .empty-text {
        font-family: var(--mono);
        font-size: 13px;
        letter-spacing: 0.05em;
      }
      .toast {
        position: fixed;
        bottom: 28px;
        right: 28px;
        z-index: 999;
        background: var(--navy);
        color: var(--white);
        font-family: var(--mono);
        font-size: 12px;
        padding: 12px 20px;
        border-radius: 10px;
        box-shadow: 8px 8px 24px rgba(10, 22, 40, 0.4);
        transform: translateY(16px);
        opacity: 0;
        transition: all 0.3s var(--ease);
        pointer-events: none;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .toast.show {
        transform: translateY(0);
        opacity: 1;
      }
      .toast.ok {
        border-color: rgba(22, 163, 74, 0.3);
      }
      .toast.err {
        border-color: rgba(255, 79, 0, 0.3);
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (max-width: 600px) {
        .nav {
          padding: 0 20px;
        }
        .nav-links {
          display: none;
        }
        .main {
          padding: 28px 16px 60px;
        }
        .np-input {
          width: 100%;
        }
      }
      .page-transition-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--bg);
        z-index: 9999;
        pointer-events: none;
        opacity: 1;
        transition: opacity 0.3s var(--ease);
      }
      .page-transition-overlay.fade-out {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <nav class="nav">
      <a href="../index.html" class="nav-brand"
        ><div class="nav-logo"><span>CF</span></div>
        Companion</a
      >
      <div class="nav-links">
        <a href="../index.html#features" class="nav-link">Features</a>
        <a href="dashboard.html" class="nav-link">Analyzer</a>
        <a href="leaderboard.html" class="nav-link">Leaderboard</a>
        <a href="contests.html" class="nav-link">Contests</a>
        <a href="ai-coach.html" class="nav-link">AI Coach</a>
        <a href="forum.html" class="nav-link active">Forum</a>
      </div>
      <div class="nav-cta">
        <a href="forum.html" class="btn-neo btn-outline">← Forum</a>
        <a href="dashboard.html" class="btn-neo btn-solid">Analyzer</a>
      </div>
    </nav>
    <main class="main">
      <div class="breadcrumb">
        <a href="forum.html">Forum</a>
        <span class="breadcrumb-sep">/</span>
        <span id="breadcrumbTitle">Thread</span>
      </div>
      <div id="threadContent">
        <div class="empty-state">
          <div class="empty-icon">⏳</div>
          <div class="empty-text">Loading thread...</div>
        </div>
      </div>
    </main>
    <div class="toast" id="toast"></div>
    <script src="../js/config.js"></script>
    <script>
      const API = window.CF_API_URL || "http://localhost:3000";
      let thread = null;
      const votedPosts = new Set(JSON.parse(localStorage.getItem("voted_posts") || "[]"));

      function toast(msg, type = "") {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.className = `toast ${type} show`;
        clearTimeout(el._t);
        el._t = setTimeout(() => el.classList.remove("show"), 3500);
      }

      function timeAgo(d) {
        const diff = Date.now() - new Date(d).getTime();
        const m = Math.floor(diff / 60000);
        if (m < 1) return "just now";
        if (m < 60) return `${m}m ago`;
        const h = Math.floor(m / 60);
        if (h < 24) return `${h}h ago`;
        return `${Math.floor(h / 24)}d ago`;
      }

      function esc(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderPost(post, isFirst, opHandle) {
        const isOP = post.authorHandle === opHandle;
        const voted = votedPosts.has(post.id);
        const repliesHTML = (post.replies || [])
          .map(
            (r) => `
    <div class="reply-card" id="reply-${r.id}">
      <div class="reply-header">
        <span class="reply-author">${esc(r.authorHandle)}</span>
        <span class="reply-time">${timeAgo(r.createdAt)}</span>
      </div>
      <div class="reply-content">${esc(r.content)}</div>
    </div>`
          )
          .join("");

        return `
    <div class="post-card ${isFirst ? "first-post" : ""}" id="post-${post.id}">
      <div class="post-inner">
        <div class="post-header">
          <div class="post-author-row">
            <div class="post-avatar ${isOP ? "op" : ""}">${post.authorHandle.charAt(0).toUpperCase()}</div>
            <div>
              <span class="post-author">${esc(post.authorHandle)}</span>
              ${isOP && !isFirst ? '<span class="post-op-badge">OP</span>' : ""}
            </div>
          </div>
          <div class="post-actions">
            <button class="upvote-btn ${voted ? "voted" : ""}" id="upvote-${post.id}" onclick="upvote(${post.id})">
              ▲ <span id="ucount-${post.id}">${post.upvotes}</span>
            </button>
            <button class="reply-btn" onclick="toggleReply(${post.id})">↩ Reply</button>
            <span class="post-time">${timeAgo(post.createdAt)}</span>
          </div>
        </div>
        <div class="post-content">${esc(post.content)}</div>
        ${repliesHTML ? `<div class="replies-list">${repliesHTML}</div>` : ""}
        <div class="reply-form" id="rform-${post.id}">
          <textarea class="reply-textarea" id="rtxt-${post.id}" placeholder="Write a reply..."></textarea>
          <div class="reply-actions">
            <button class="reply-submit" onclick="submitReply(${post.id})">Post Reply</button>
            <button class="reply-cancel" onclick="toggleReply(${post.id})">Cancel</button>
          </div>
        </div>
      </div>
    </div>`;
      }

      function renderThread(data) {
        thread = data;
        const opHandle = data.authorHandle;
        document.title = `${data.title} — CFCompanion Forum`;
        document.getElementById("breadcrumbTitle").textContent = data.title;
        const posts = data.posts || [];
        const postsHTML = posts.map((p, i) => renderPost(p, i === 0, opHandle)).join("");
        document.getElementById("threadContent").innerHTML = `
    <div class="thread-header">
      ${data.tag ? `<div class="thread-tag-badge">${esc(data.tag)}</div>` : ""}
      <div class="thread-title">${esc(data.title)}</div>
      <div class="thread-meta-row">
        <span class="thread-meta-item">by <strong>${esc(data.authorHandle)}</strong></span>
        <span class="thread-meta-item">${timeAgo(data.createdAt)}</span>
        <span class="thread-meta-item"><strong>${posts.length}</strong> posts</span>
      </div>
    </div>
    <div class="posts-list" id="postsList">
      ${postsHTML || '<div class="empty-state"><div class="empty-icon">💬</div><div class="empty-text">No posts yet.</div></div>'}
    </div>
    <div class="new-post-panel">
      <div class="np-header">// Reply to Thread</div>
      <div class="np-body">
        <div class="np-handle-row">
          <input class="np-input" id="npHandle" type="text" placeholder="your CF handle" value="${esc(localStorage.getItem("cf_handle") || "")}" spellcheck="false">
        </div>
        <textarea class="np-textarea" id="npContent" placeholder="Share your thoughts, solution approach, or question..."></textarea>
        <button class="np-submit" onclick="submitPost()">Post Reply →</button>
      </div>
    </div>`;
      }

      function toggleReply(postId) {
        const form = document.getElementById(`rform-${postId}`);
        const wasOpen = form.classList.contains("open");
        document.querySelectorAll(".reply-form.open").forEach((f) => f.classList.remove("open"));
        if (!wasOpen) {
          form.classList.add("open");
          document.getElementById(`rtxt-${postId}`).focus();
        }
      }

      async function upvote(postId) {
        if (votedPosts.has(postId)) {
          toast("Already upvoted", "err");
          return;
        }
        try {
          const res = await fetch(`${API}/api/forum/posts/${postId}/upvote`, { method: "POST" });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error);
          votedPosts.add(postId);
          localStorage.setItem("voted_posts", JSON.stringify([...votedPosts]));
          document.getElementById(`ucount-${postId}`).textContent = data.upvotes;
          document.getElementById(`upvote-${postId}`).classList.add("voted");
        } catch (err) {
          toast(err.message, "err");
        }
      }

      async function submitReply(parentId) {
        const handle = (
          document.getElementById("npHandle")?.value ||
          localStorage.getItem("cf_handle") ||
          ""
        ).trim();
        const content = document.getElementById(`rtxt-${parentId}`).value.trim();
        if (!handle || !content) {
          toast("Handle and reply required", "err");
          return;
        }
        const btn = document.querySelector(`#rform-${parentId} .reply-submit`);
        btn.disabled = true;
        btn.textContent = "Posting...";
        try {
          const res = await fetch(`${API}/api/forum/threads/${thread.id}/posts`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ authorHandle: handle, content, parentId }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error);
          toast("Reply posted!", "ok");
          const replyHTML = `<div class="reply-card" id="reply-${data.id}"><div class="reply-header"><span class="reply-author">${esc(handle)}</span><span class="reply-time">just now</span></div><div class="reply-content">${esc(content)}</div></div>`;
          const postCard = document.getElementById(`post-${parentId}`);
          let repliesList = postCard.querySelector(".replies-list");
          if (!repliesList) {
            repliesList = document.createElement("div");
            repliesList.className = "replies-list";
            postCard.querySelector(".post-content").insertAdjacentElement("afterend", repliesList);
          }
          repliesList.insertAdjacentHTML("beforeend", replyHTML);
          document.getElementById(`rtxt-${parentId}`).value = "";
          document.getElementById(`rform-${parentId}`).classList.remove("open");
        } catch (err) {
          toast(err.message, "err");
        } finally {
          btn.disabled = false;
          btn.textContent = "Post Reply";
        }
      }

      async function submitPost() {
        const handle = document.getElementById("npHandle").value.trim();
        const content = document.getElementById("npContent").value.trim();
        if (!handle || !content) {
          toast("Handle and content required", "err");
          return;
        }
        const btn = document.querySelector(".np-submit");
        btn.disabled = true;
        btn.textContent = "Posting...";
        try {
          const res = await fetch(`${API}/api/forum/threads/${thread.id}/posts`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ authorHandle: handle, content }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error);
          localStorage.setItem("cf_handle", handle);
          toast("Posted!", "ok");
          document.getElementById("npContent").value = "";
          const list = document.getElementById("postsList");
          const empty = list.querySelector(".empty-state");
          if (empty) empty.remove();
          list.insertAdjacentHTML(
            "beforeend",
            renderPost({ ...data, replies: [] }, false, thread.authorHandle)
          );
          document
            .getElementById(`post-${data.id}`)
            ?.scrollIntoView({ behavior: "smooth", block: "center" });
        } catch (err) {
          toast(err.message, "err");
        } finally {
          btn.disabled = false;
          btn.textContent = "Post Reply →";
        }
      }

      async function loadThread(id) {
        try {
          const res = await fetch(`${API}/api/forum/threads/${id}`);
          if (!res.ok) throw new Error("Thread not found");
          renderThread(await res.json());
        } catch (err) {
          document.getElementById("threadContent").innerHTML =
            `<div class="empty-state"><div class="empty-icon">⚠</div><div class="empty-text">${err.message}</div></div>`;
        }
      }

      const id = new URLSearchParams(window.location.search).get("id");
      if (id) loadThread(id);
      else
        document.getElementById("threadContent").innerHTML =
          `<div class="empty-state"><div class="empty-icon">💬</div><div class="empty-text">No thread selected. <a href="forum.html" style="color:var(--cf);font-family:var(--mono);font-size:12px">Back →</a></div></div>`;

      (function () {
        const o = document.createElement("div");
        o.className = "page-transition-overlay";
        document.body.appendChild(o);
        requestAnimationFrame(() => o.classList.add("fade-out"));
        setTimeout(() => o.remove(), 400);
        document.querySelectorAll("a").forEach((link) => {
          const href = link.getAttribute("href");
          if (!href || href.startsWith("#") || href.startsWith("http") || link.target === "_blank")
            return;
          link.addEventListener("click", (e) => {
            e.preventDefault();
            const x = document.createElement("div");
            x.className = "page-transition-overlay fade-out";
            document.body.appendChild(x);
            requestAnimationFrame(() => x.classList.remove("fade-out"));
            setTimeout(() => (window.location.href = href), 300);
          });
        });
      })();
    </script>
  </body>
</html>
