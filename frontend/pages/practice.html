<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice — CFCompanion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Syne:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f2f0eb;
        --bg-2: #eceae4;
        --bg-3: #e4e2dc;
        --ink: #0f0e0c;
        --ink-2: #3a3830;
        --ink-3: #7a7670;
        --cf: #ff4f00;
        --cf-dim: #cc3f00;
        --cf-pale: #fff0eb;
        --navy: #0a1628;
        --navy-2: #162238;
        --white: #fafaf8;
        --green: #16a34a;
        --green-pale: #f0fdf4;
        --neo-out: 6px 6px 14px #c8c6c0, -4px -4px 10px #ffffff;
        --neo-in: inset 3px 3px 8px #c8c6c0, inset -3px -3px 6px #ffffff;
        --neo-card: 8px 8px 20px #c0beb8, -5px -5px 14px #ffffff;
        --neo-sm: 3px 3px 8px #c8c6c0, -2px -2px 6px #ffffff;
        --serif: "Instrument Serif", Georgia, serif;
        --mono: "DM Mono", monospace;
        --sans: "Syne", sans-serif;
        --ease: cubic-bezier(0.23, 1, 0.32, 1);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: #c8c6c0;
        border-radius: 99px;
      }
      html {
        scrollbar-width: thin;
        scrollbar-color: #c8c6c0 var(--bg);
        overflow-y: scroll;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        opacity: 0.025;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        background-size: 160px 160px;
      }

      .nav {
        position: sticky;
        top: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        height: 60px;
        background: rgba(242, 240, 235, 0.9);
        backdrop-filter: blur(16px) saturate(140%);
        border-bottom: 1px solid rgba(15, 14, 12, 0.08);
      }
      .nav-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: var(--sans);
        font-weight: 800;
        font-size: 17px;
        letter-spacing: -0.04em;
        color: var(--ink);
        text-decoration: none;
      }
      .nav-logo {
        width: 28px;
        height: 28px;
        border-radius: 7px;
        background: var(--navy);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--neo-sm);
      }
      .nav-logo span {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--cf);
      }
      .nav-links {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 4px;
      }
      .nav-link {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--ink-3);
        text-decoration: none;
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid transparent;
        transition: all 0.2s var(--ease);
      }
      .nav-link:hover {
        color: var(--ink);
        background: var(--bg-2);
        box-shadow: var(--neo-sm);
        border-color: rgba(15, 14, 12, 0.06);
      }
      .nav-link.active {
        color: var(--cf);
        border-color: rgba(255, 79, 0, 0.2);
        background: var(--cf-pale);
      }
      .nav-cta {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .btn-neo {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.04em;
        padding: 9px 20px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        transition: all 0.18s var(--ease);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .btn-outline {
        background: var(--bg);
        color: var(--ink);
        box-shadow: var(--neo-out);
        border: 1px solid rgba(15, 14, 12, 0.08);
      }
      .btn-outline:hover {
        box-shadow: var(--neo-in);
        transform: translateY(1px);
      }
      .btn-solid {
        background: var(--navy);
        color: var(--white);
        box-shadow: 4px 4px 12px rgba(10, 22, 40, 0.35);
      }
      .btn-solid:hover {
        background: var(--navy-2);
        transform: translateY(-1px);
      }

      .main {
        max-width: 900px;
        margin: 0 auto;
        padding: 48px 32px 80px;
      }

      /* Session header */
      .session-header {
        background: var(--navy);
        border-radius: 20px;
        padding: 28px 32px;
        margin-bottom: 24px;
        position: relative;
        overflow: hidden;
        animation: fadeUp 0.5s var(--ease) both;
      }
      .session-header::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, var(--cf), transparent);
      }
      .session-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .session-mode-badge {
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        padding: 4px 10px;
        border-radius: 99px;
        background: rgba(255, 79, 0, 0.15);
        color: var(--cf);
        border: 1px solid rgba(255, 79, 0, 0.25);
        margin-bottom: 8px;
        display: inline-block;
      }
      .session-title {
        font-family: var(--serif);
        font-size: 26px;
        font-weight: 400;
        color: var(--white);
        letter-spacing: -0.02em;
      }
      .session-meta {
        font-family: var(--mono);
        font-size: 11px;
        color: rgba(255, 255, 255, 0.35);
        margin-top: 4px;
      }

      /* Timer */
      .timer-wrap {
        text-align: right;
      }
      .timer-label {
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.3);
        margin-bottom: 4px;
      }
      .timer-display {
        font-family: var(--mono);
        font-size: 36px;
        font-weight: 500;
        letter-spacing: -0.04em;
        color: var(--white);
        line-height: 1;
      }
      .timer-display.warning {
        color: var(--cf);
      }
      .timer-display.danger {
        color: #f87171;
      }

      /* Progress bar */
      .progress-wrap {
        margin-top: 16px;
      }
      .progress-label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      .progress-text {
        font-family: var(--mono);
        font-size: 10px;
        color: rgba(255, 255, 255, 0.35);
        letter-spacing: 0.08em;
      }
      .progress-track {
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 99px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--cf), #ff8c55);
        border-radius: 99px;
        transition: width 0.5s var(--ease);
      }

      /* Controls */
      .session-controls {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }
      .ctrl-btn {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.06em;
        padding: 8px 16px;
        border-radius: 7px;
        border: none;
        cursor: pointer;
        transition: all 0.2s var(--ease);
      }
      .ctrl-start {
        background: var(--cf);
        color: var(--white);
        box-shadow: 0 4px 14px rgba(255, 79, 0, 0.3);
      }
      .ctrl-start:hover {
        background: var(--cf-dim);
        transform: translateY(-1px);
      }
      .ctrl-finish {
        background: rgba(22, 163, 74, 0.15);
        color: #6ee7b7;
        border: 1px solid rgba(22, 163, 74, 0.25);
      }
      .ctrl-finish:hover {
        background: rgba(22, 163, 74, 0.25);
      }
      .ctrl-finish:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .ctrl-back {
        background: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .ctrl-back:hover {
        background: rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.7);
      }

      /* Problem cards */
      .problems-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
        animation: fadeUp 0.5s 0.1s var(--ease) both;
      }

      .problem-card {
        background: var(--bg);
        border-radius: 16px;
        box-shadow: var(--neo-card);
        border: 1px solid rgba(255, 255, 255, 0.7);
        overflow: hidden;
        transition:
          transform 0.25s var(--ease),
          box-shadow 0.25s var(--ease);
      }
      .problem-card:hover {
        transform: translateY(-2px);
        box-shadow:
          10px 10px 28px #bbbab4,
          -6px -6px 18px #ffffff;
      }
      .problem-card.solved {
        border-color: rgba(22, 163, 74, 0.3);
        background: var(--green-pale);
      }

      .problem-card-inner {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 18px 24px;
      }

      .problem-num {
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 500;
        color: var(--ink-3);
        width: 24px;
        flex-shrink: 0;
      }

      .problem-info {
        flex: 1;
        min-width: 0;
      }
      .problem-name {
        font-family: var(--sans);
        font-size: 15px;
        font-weight: 600;
        color: var(--ink);
        margin-bottom: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .problem-card.solved .problem-name {
        color: var(--green);
        text-decoration: line-through;
        text-decoration-color: rgba(22, 163, 74, 0.4);
      }
      .problem-tags-row {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--ink-3);
      }

      .problem-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      .problem-rating-badge {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 500;
        padding: 4px 12px;
        border-radius: 99px;
        background: var(--bg-2);
        box-shadow: var(--neo-sm);
        border: 1px solid rgba(15, 14, 12, 0.07);
        color: var(--ink-2);
      }

      .btn-open {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.04em;
        padding: 8px 16px;
        border-radius: 8px;
        text-decoration: none;
        background: var(--navy);
        color: var(--white);
        box-shadow: 3px 3px 8px rgba(10, 22, 40, 0.25);
        transition: all 0.2s var(--ease);
      }
      .btn-open:hover {
        background: var(--navy-2);
        transform: translateY(-1px);
      }

      .btn-solved {
        font-family: var(--mono);
        font-size: 11px;
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid rgba(15, 14, 12, 0.1);
        background: var(--bg);
        color: var(--ink-3);
        box-shadow: var(--neo-out);
        cursor: pointer;
        transition: all 0.2s var(--ease);
      }
      .btn-solved:hover {
        box-shadow: var(--neo-in);
        transform: translateY(1px);
      }
      .problem-card.solved .btn-solved {
        background: var(--green-pale);
        color: var(--green);
        border-color: rgba(22, 163, 74, 0.3);
        box-shadow: none;
      }

      /* Hint panel inside card */
      .hint-panel {
        border-top: 1px solid rgba(15, 14, 12, 0.06);
        padding: 14px 24px;
        display: none;
      }
      .hint-panel.open {
        display: block;
      }
      .hint-level-row {
        display: flex;
        gap: 6px;
        margin-bottom: 10px;
      }
      .hlvl-btn {
        font-family: var(--mono);
        font-size: 10px;
        padding: 5px 12px;
        border-radius: 6px;
        border: 1px solid rgba(15, 14, 12, 0.1);
        background: var(--bg);
        color: var(--ink-3);
        box-shadow: var(--neo-sm);
        cursor: pointer;
        transition: all 0.15s var(--ease);
      }
      .hlvl-btn.active {
        background: var(--navy);
        color: var(--white);
        border-color: transparent;
        box-shadow: 2px 2px 6px rgba(10, 22, 40, 0.25);
      }
      .get-hint-btn {
        font-family: var(--mono);
        font-size: 11px;
        padding: 7px 14px;
        border-radius: 7px;
        border: none;
        background: var(--bg-2);
        color: var(--ink-2);
        cursor: pointer;
        box-shadow: var(--neo-sm);
        transition: all 0.15s var(--ease);
        margin-left: auto;
        display: block;
      }
      .get-hint-btn:hover {
        background: var(--bg-3);
      }
      .hint-output {
        font-family: var(--sans);
        font-size: 13px;
        color: var(--ink-2);
        line-height: 1.65;
        padding: 12px;
        background: var(--bg-2);
        border-radius: 8px;
        border-left: 3px solid var(--cf);
        display: none;
      }
      .hint-output.show {
        display: block;
      }
      .hint-spinner {
        display: none;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink-3);
      }
      .hint-spinner.show {
        display: block;
      }

      /* Completed state */
      .completed-banner {
        background: var(--navy);
        border-radius: 16px;
        padding: 28px 32px;
        text-align: center;
        display: none;
        animation: fadeUp 0.4s var(--ease);
      }
      .completed-banner.show {
        display: block;
      }
      .completed-icon {
        font-size: 40px;
        margin-bottom: 12px;
      }
      .completed-title {
        font-family: var(--serif);
        font-size: 28px;
        color: var(--white);
        letter-spacing: -0.02em;
        margin-bottom: 8px;
      }
      .completed-sub {
        font-family: var(--mono);
        font-size: 12px;
        color: rgba(255, 255, 255, 0.4);
        margin-bottom: 20px;
      }
      .completed-stats {
        display: flex;
        justify-content: center;
        gap: 32px;
        margin-bottom: 24px;
      }
      .cstat {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      .cstat-val {
        font-family: var(--mono);
        font-size: 28px;
        font-weight: 500;
        color: var(--cf);
      }
      .cstat-label {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.12em;
        color: rgba(255, 255, 255, 0.35);
        text-transform: uppercase;
      }

      /* Empty / loading */
      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 100px 24px;
        gap: 16px;
        color: var(--ink-3);
        text-align: center;
      }
      .empty-icon {
        font-size: 48px;
        opacity: 0.2;
      }
      .empty-text {
        font-family: var(--mono);
        font-size: 13px;
        letter-spacing: 0.05em;
      }

      .toast {
        position: fixed;
        bottom: 28px;
        right: 28px;
        z-index: 999;
        background: var(--navy);
        color: var(--white);
        font-family: var(--mono);
        font-size: 12px;
        padding: 12px 20px;
        border-radius: 10px;
        box-shadow: 8px 8px 24px rgba(10, 22, 40, 0.4);
        transform: translateY(16px);
        opacity: 0;
        transition: all 0.3s var(--ease);
        pointer-events: none;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .toast.show {
        transform: translateY(0);
        opacity: 1;
      }
      .toast.ok {
        border-color: rgba(22, 163, 74, 0.3);
      }
      .toast.err {
        border-color: rgba(255, 79, 0, 0.3);
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 768px) {
        .nav {
          padding: 0 20px;
        }
        .nav-links {
          display: none;
        }
        .main {
          padding: 28px 16px 60px;
        }
        .problem-card-inner {
          flex-wrap: wrap;
        }
        .problem-right {
          width: 100%;
        }
        .session-top {
          flex-direction: column;
          gap: 16px;
        }
        .timer-wrap {
          text-align: left;
        }
      }

      .page-transition-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--bg);
        z-index: 9999;
        pointer-events: none;
        opacity: 1;
        transition: opacity 0.3s var(--ease);
      }
      .page-transition-overlay.fade-out {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <nav class="nav">
      <a href="../index.html" class="nav-brand"
        ><div class="nav-logo"><span>CF</span></div>
        Companion</a
      >
      <div class="nav-links">
        <a href="../index.html#features" class="nav-link">Features</a>
        <a href="dashboard.html" class="nav-link">Analyzer</a>
        <a href="leaderboard.html" class="nav-link">Leaderboard</a>
        <a href="contests.html" class="nav-link">Contests</a>
        <a href="ai-coach.html" class="nav-link">AI Coach</a>
        <a href="forum.html" class="nav-link">Forum</a>
      </div>
      <div class="nav-cta">
        <a href="ai-coach.html" class="btn-neo btn-outline">← Back to Coach</a>
        <a href="dashboard.html" class="btn-neo btn-solid">Analyzer</a>
      </div>
    </nav>

    <main class="main">
      <div id="loadingState" class="empty-state">
        <div class="empty-icon">⏳</div>
        <div class="empty-text">Loading practice set...</div>
      </div>

      <div id="practiceContent" style="display: none">
        <!-- Session header -->
        <div class="session-header">
          <div class="session-top">
            <div>
              <div class="session-mode-badge" id="modeBadge">Practice</div>
              <div class="session-title" id="sessionTitle">—</div>
              <div class="session-meta" id="sessionMeta">—</div>
            </div>
            <div class="timer-wrap" id="timerWrap" style="display: none">
              <div class="timer-label">Time Remaining</div>
              <div class="timer-display" id="timerDisplay">00:00:00</div>
            </div>
          </div>
          <div class="progress-wrap">
            <div class="progress-label">
              <span class="progress-text" id="progressText">0 / 0 solved</span>
              <span class="progress-text" id="progressPct">0%</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
          </div>
          <div class="session-controls">
            <button class="ctrl-btn ctrl-start" id="startBtn" onclick="startSession()">
              ▶ Start Session
            </button>
            <button class="ctrl-btn ctrl-finish" id="finishBtn" onclick="finishSession()" disabled>
              ✓ Finish
            </button>
            <a href="ai-coach.html" class="ctrl-btn ctrl-back">← New Set</a>
          </div>
        </div>

        <!-- Completed banner (hidden initially) -->
        <div class="completed-banner" id="completedBanner">
          <div class="completed-icon">🎉</div>
          <div class="completed-title">Session Complete!</div>
          <div class="completed-sub" id="completedTime">—</div>
          <div class="completed-stats">
            <div class="cstat">
              <div class="cstat-val" id="cSolved">0</div>
              <div class="cstat-label">Solved</div>
            </div>
            <div class="cstat">
              <div class="cstat-val" id="cTotal">0</div>
              <div class="cstat-label">Total</div>
            </div>
            <div class="cstat">
              <div class="cstat-val" id="cTime">—</div>
              <div class="cstat-label">Time Used</div>
            </div>
          </div>
          <a href="ai-coach.html" class="btn-neo btn-solid" style="display: inline-flex"
            >Generate Another Set →</a
          >
        </div>

        <!-- Problems -->
        <div class="problems-list" id="problemsList"></div>
      </div>
    </main>

    <div class="toast" id="toast"></div>
    <script src="../js/config.js"></script>
    <script>
      const API = window.CF_API_URL || "http://localhost:3000";
      let set = null;
      let sessionStarted = false;
      let sessionStartTime = null;
      let timerInterval = null;
      let hintLevels = {}; // problemIndex → level

      function toast(msg, type = "") {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.className = `toast ${type} show`;
        clearTimeout(el._t);
        el._t = setTimeout(() => el.classList.remove("show"), 3500);
      }

      function pad(n) {
        return String(n).padStart(2, "0");
      }

      function formatDuration(ms) {
        const s = Math.floor(ms / 1000);
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const sec = s % 60;
        return h > 0 ? `${pad(h)}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
      }

      function getSolvedSet() {
        const key = `solved_set_${set?.id}`;
        return new Set(JSON.parse(localStorage.getItem(key) || "[]"));
      }

      function markSolved(idx) {
        const key = `solved_set_${set.id}`;
        const solved = getSolvedSet();
        if (solved.has(idx)) {
          solved.delete(idx);
        } else {
          solved.add(idx);
        }
        localStorage.setItem(key, JSON.stringify([...solved]));
        renderProblems();
        updateProgress();
      }

      function updateProgress() {
        const solved = getSolvedSet();
        const total = set.problems.length;
        const n = solved.size;
        document.getElementById("progressText").textContent = `${n} / ${total} solved`;
        const pct = total > 0 ? Math.round((n / total) * 100) : 0;
        document.getElementById("progressPct").textContent = `${pct}%`;
        document.getElementById("progressFill").style.width = pct + "%";
        document.getElementById("finishBtn").disabled = !sessionStarted;
      }

      function renderProblems() {
        const solved = getSolvedSet();
        const container = document.getElementById("problemsList");
        container.innerHTML = set.problems
          .map((p, i) => {
            const isSolved = solved.has(i);
            const level = hintLevels[i] || 1;
            return `
    <div class="problem-card ${isSolved ? "solved" : ""}" id="pcard-${i}">
      <div class="problem-card-inner">
        <div class="problem-num">${i + 1}</div>
        <div class="problem-info">
          <div class="problem-name">${p.name}</div>
          <div class="problem-tags-row">${p.tags.slice(0, 4).join(" · ")}</div>
        </div>
        <div class="problem-right">
          <div class="problem-rating-badge">${p.rating}</div>
          <a class="btn-open" href="${p.url}" target="_blank" rel="noopener">Open →</a>
          <button class="btn-solved" onclick="markSolved(${i})">${isSolved ? "✓ Solved" : "Mark Solved"}</button>
          <button onclick="toggleHint(${i})" style="font-family:var(--mono);font-size:11px;background:none;border:none;color:var(--ink-3);cursor:pointer;padding:6px">💡</button>
        </div>
      </div>
      <div class="hint-panel" id="hpanel-${i}">
        <div class="hint-level-row">
          <button class="hlvl-btn ${level === 1 ? "active" : ""}" onclick="setHintLevel(${i},1)">Nudge</button>
          <button class="hlvl-btn ${level === 2 ? "active" : ""}" onclick="setHintLevel(${i},2)">Key Idea</button>
          <button class="hlvl-btn ${level === 3 ? "active" : ""}" onclick="setHintLevel(${i},3)">Approach</button>
          <button class="get-hint-btn" onclick="fetchHint(${i})">Get Hint →</button>
        </div>
        <div class="hint-spinner" id="hspinner-${i}">Thinking...</div>
        <div class="hint-output" id="houtput-${i}"></div>
      </div>
    </div>`;
          })
          .join("");
      }

      function toggleHint(i) {
        const panel = document.getElementById(`hpanel-${i}`);
        panel.classList.toggle("open");
      }

      function setHintLevel(i, level) {
        hintLevels[i] = level;
        const panel = document.getElementById(`hpanel-${i}`);
        panel.querySelectorAll(".hlvl-btn").forEach((b, idx) => {
          b.classList.toggle("active", idx + 1 === level);
        });
      }

      async function fetchHint(i) {
        const p = set.problems[i];
        const level = hintLevels[i] || 1;
        const spinner = document.getElementById(`hspinner-${i}`);
        const output = document.getElementById(`houtput-${i}`);
        spinner.classList.add("show");
        output.classList.remove("show");
        try {
          const res = await fetch(`${API}/api/ai/hint`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contestId: p.contestId,
              problemIndex: p.index,
              problemName: p.name,
              tags: p.tags,
              rating: p.rating,
              level,
            }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error);
          output.textContent = data.hint;
          output.classList.add("show");
        } catch (err) {
          output.textContent = "Could not get hint: " + err.message;
          output.classList.add("show");
        } finally {
          spinner.classList.remove("show");
        }
      }

      async function startSession() {
        if (sessionStarted) return;
        sessionStarted = true;
        sessionStartTime = Date.now();
        document.getElementById("startBtn").textContent = "▶ Running";
        document.getElementById("startBtn").disabled = true;
        document.getElementById("finishBtn").disabled = false;

        await fetch(`${API}/api/ai/practice-set/${set.id}/start`, { method: "POST" });

        // Start timer for contest mode
        if (set.mode === "contest" && set.durationMin) {
          const totalMs = set.durationMin * 60 * 1000;
          const timerWrap = document.getElementById("timerWrap");
          const timerDisplay = document.getElementById("timerDisplay");
          timerWrap.style.display = "block";

          timerInterval = setInterval(() => {
            const elapsed = Date.now() - sessionStartTime;
            const remaining = Math.max(0, totalMs - elapsed);
            const h = Math.floor(remaining / 3600000);
            const m = Math.floor((remaining % 3600000) / 60000);
            const s = Math.floor((remaining % 60000) / 1000);
            timerDisplay.textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;

            const pct = remaining / totalMs;
            if (pct < 0.1) timerDisplay.className = "timer-display danger";
            else if (pct < 0.25) timerDisplay.className = "timer-display warning";
            else timerDisplay.className = "timer-display";

            if (remaining === 0) {
              clearInterval(timerInterval);
              toast("Time's up!", "err");
              finishSession();
            }
          }, 1000);
        }
      }

      async function finishSession() {
        if (timerInterval) clearInterval(timerInterval);
        await fetch(`${API}/api/ai/practice-set/${set.id}/complete`, { method: "POST" });

        const elapsed = Date.now() - (sessionStartTime || Date.now());
        const solved = getSolvedSet();
        const total = set.problems.length;

        document.getElementById("completedBanner").classList.add("show");
        document.getElementById("cSolved").textContent = solved.size;
        document.getElementById("cTotal").textContent = total;
        document.getElementById("cTime").textContent = formatDuration(elapsed);
        document.getElementById("completedTime").textContent =
          `Finished in ${formatDuration(elapsed)}`;

        document.getElementById("finishBtn").disabled = true;
        document.getElementById("startBtn").disabled = true;
      }

      async function loadSet(id) {
        try {
          const res = await fetch(`${API}/api/ai/practice-set/${id}`);
          if (!res.ok) throw new Error("Set not found");
          set = await res.json();

          document.getElementById("loadingState").style.display = "none";
          document.getElementById("practiceContent").style.display = "block";

          document.getElementById("modeBadge").textContent =
            set.mode === "contest" ? "Virtual Contest" : "Practice Set";
          document.getElementById("sessionTitle").textContent = set.title;
          document.getElementById("sessionMeta").textContent =
            `${set.problems.length} problems${set.durationMin ? ` · ${set.durationMin} min` : ""}`;

          // If already completed
          if (set.completedAt) {
            document.getElementById("startBtn").disabled = true;
            document.getElementById("finishBtn").disabled = true;
          }

          renderProblems();
          updateProgress();
        } catch (err) {
          document.getElementById("loadingState").innerHTML = `
      <div class="empty-icon">⚠</div>
      <div class="empty-text">${err.message}</div>`;
        }
      }

      // Init
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      if (id) {
        loadSet(id);
      } else {
        document.getElementById("loadingState").innerHTML = `
    <div class="empty-icon">📋</div>
    <div class="empty-text">No practice set selected.<br><a href="ai-coach.html" style="color:var(--cf);font-family:var(--mono);font-size:12px">Generate one →</a></div>`;
      }

      // Page transition
      (function () {
        const overlay = document.createElement("div");
        overlay.className = "page-transition-overlay";
        document.body.appendChild(overlay);
        requestAnimationFrame(() => overlay.classList.add("fade-out"));
        setTimeout(() => overlay.remove(), 400);
        document.querySelectorAll("a").forEach((link) => {
          const href = link.getAttribute("href");
          if (!href || href.startsWith("#") || href.startsWith("http") || link.target === "_blank")
            return;
          link.addEventListener("click", (e) => {
            e.preventDefault();
            const exit = document.createElement("div");
            exit.className = "page-transition-overlay fade-out";
            document.body.appendChild(exit);
            requestAnimationFrame(() => exit.classList.remove("fade-out"));
            setTimeout(() => (window.location.href = href), 300);
          });
        });
      })();
    </script>
  </body>
</html>
