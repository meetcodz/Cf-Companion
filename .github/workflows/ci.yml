name: Code Quality CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Root Config Dependencies
      run: npm install

    - name: Install Backend Dependencies
      run: npm run install:all

    - name: Validate Prisma Schema
      run: npx prisma validate --schema=backend/prisma/schema.prisma

    - name: Check Formatting (Prettier)
      run: npx prettier --check "backend/src/**/*.js" "frontend/js/**/*.js" "frontend/css/**/*.css"

    - name: Lint Codebase (ESLint)
      run: npx eslint "backend/src/**/*.js"
